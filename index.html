  <title>Ricardo Valera García</title>

  <meta name="robots" content="max-image-preview:large">
  <link rel="icon" id="favicon" href="assets/favicon-light.png">
  <script>
    /* Claro por defecto; oscuro si el sistema/navegador está en modo oscuro */
    (function () {
      var link = document.getElementById("favicon");
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function set() { link.href = mq.matches ? "assets/favicon-dark.png" : "assets/favicon-light.png"; }
      set();
      if (mq.addEventListener) mq.addEventListener("change", set);
      else if (mq.addListener) mq.addListener(set);
    })();
  </script>

  <script>
    /* Animación de entrada: esconde lo que va a aparecer antes del primer pintado
       (salvo con "reducir movimiento"). Si main.js no arranca, a los 4 s se muestra todo. */
    (function () {
      var d = document.documentElement;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      d.classList.add("intro-anim");
      setTimeout(function () {
        if (!window.__introOK) d.classList.add("reveal-all");
      }, 4000);
    })();
  </script>
